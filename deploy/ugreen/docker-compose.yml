# rebuild backend for NAS library fallback
name: kindred

services:
  database:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kindred}
      POSTGRES_USER: ${POSTGRES_USER:-kindred}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [kindred-internal]

  api:
    image: kindred-api:recovery-54b251c
    build:
      context: ../../backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kindred}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-kindred}
      PYTHONUNBUFFERED: "1"
      XDG_CACHE_HOME: /app/cache
      PHOTO_STORAGE_ROOT: /data/photos/originals
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      SCAN_SECRET: ${SCAN_SECRET:?Set SCAN_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://kindredphotos.app,https://nas.kindredphotos.app}
      FLICKR_API_KEY: ${FLICKR_API_KEY:-}
      FLICKR_SECRET: ${FLICKR_SECRET:-}
      FLICKR_OAUTH_TOKEN: ${FLICKR_OAUTH_TOKEN:-}
      FLICKR_OAUTH_SECRET: ${FLICKR_OAUTH_SECRET:-}
      FLICKR_USER_ID: ${FLICKR_USER_ID:-}
      APP_REVIEW_USERNAME: ${APP_REVIEW_USERNAME:-}
      APP_REVIEW_PASSWORD: ${APP_REVIEW_PASSWORD:-}
    volumes:
      - ../../backend/main.py:/app/main.py:ro
      - ../../backend/staged_import.py:/app/staged_import.py:ro
      - ../../backend/resume_nas_library.py:/app/resume_nas_library.py:ro
      - ../../backend/library_status.py:/app/library_status.py:ro
      - ../../backend/index_nas_library.py:/app/index_nas_library.py:ro
      - ./data/backend:/app/data
      - ./data/photos:/data/photos
      - ./data/model-cache:/app/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks: [kindred-internal]

  library-worker:
    image: kindred-api:recovery-54b251c
    restart: on-failure
    command: ["python", "-u", "/app/data/nas_library_worker.py"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kindred}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-kindred}
      PYTHONUNBUFFERED: "1"
      XDG_CACHE_HOME: /app/cache
      PHOTO_STORAGE_ROOT: /data/photos/originals
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      SCAN_SECRET: ${SCAN_SECRET:?Set SCAN_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://kindredphotos.app,https://nas.kindredphotos.app}
      FLICKR_API_KEY: ${FLICKR_API_KEY:-}
      FLICKR_SECRET: ${FLICKR_SECRET:-}
      FLICKR_OAUTH_TOKEN: ${FLICKR_OAUTH_TOKEN:-}
      FLICKR_OAUTH_SECRET: ${FLICKR_OAUTH_SECRET:-}
      FLICKR_USER_ID: ${FLICKR_USER_ID:-}
      APP_REVIEW_USERNAME: ${APP_REVIEW_USERNAME:-}
      APP_REVIEW_PASSWORD: ${APP_REVIEW_PASSWORD:-}
      PYTHONPATH: /app:/app/data
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    volumes:
      - ../../backend/nas_library_worker.py:/app/data/nas_library_worker.py:ro
      - ../../backend/resume_nas_library.py:/app/data/resume_nas_library.py:ro
      - ../../backend/staged_import.py:/app/data/staged_import.py:ro
      - ../../backend/index_nas_library.py:/app/data/index_nas_library.py:ro
      - ../../backend/main.py:/app/main.py:ro
      - ./data/backend:/app/data
      - ./data/photos:/data/photos
      - ./data/model-cache:/app/cache
    networks: [kindred-internal]

  web:
    build:
      context: ../../apps/web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      BACKEND_URL: http://api:8000
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in .env}
      FLICKR_API_KEY: ${FLICKR_API_KEY:-}
      FLICKR_SECRET: ${FLICKR_SECRET:-}
      NEXT_PUBLIC_APP_URL: ${PUBLIC_WEB_URL:-https://nas.kindredphotos.app}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-Kindred Photos <noreply@kindredphotos.app>}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks: [kindred-internal]

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [public]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks: [kindred-internal]

networks:
  kindred-internal:
    driver: bridge
