# Production deployment template: rendered from a pinned Git commit.
name: kindred

services:
  database:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kindred}
      POSTGRES_USER: ${POSTGRES_USER:-kindred}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [kindred-internal]

  api:
    image: kindred-api:${KINDRED_REVISION:?Set KINDRED_REVISION}
    build:
      context: ${KINDRED_SOURCE_ROOT:?Set KINDRED_SOURCE_ROOT}/backend
      labels:
        org.opencontainers.image.revision: ${KINDRED_REVISION}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kindred}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-kindred}
      PYTHONUNBUFFERED: "1"
      XDG_CACHE_HOME: /app/cache
      # Evictable transforms survive application container replacements.
      IMAGE_CACHE_PATH: /app/cache/image-transforms.sqlite3
      PHOTO_STORAGE_ROOT: /data/photos/originals
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      SCAN_SECRET: ${SCAN_SECRET:?Set SCAN_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://kindredphotos.app,https://nas.kindredphotos.app}
      FLICKR_API_KEY: ${FLICKR_API_KEY:-}
      FLICKR_SECRET: ${FLICKR_SECRET:-}
      FLICKR_OAUTH_TOKEN: ${FLICKR_OAUTH_TOKEN:-}
      FLICKR_OAUTH_SECRET: ${FLICKR_OAUTH_SECRET:-}
      FLICKR_USER_ID: ${FLICKR_USER_ID:-}
      APP_REVIEW_USERNAME: ${APP_REVIEW_USERNAME:-}
      APP_REVIEW_PASSWORD: ${APP_REVIEW_PASSWORD:-}
    volumes:
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/backend:/app/data
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/photos:/data/photos
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/model-cache:/app/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks: [kindred-internal]

  library-worker:
    image: kindred-api:${KINDRED_REVISION:?Set KINDRED_REVISION}
    restart: on-failure
    # The worker paces itself now -- see backend/throttle.py -- so the quota is
    # a guard rail rather than the control. It leaves two of the twelve cores
    # for the host and the API no matter what the loop decides; the loop is what
    # gives the run full speed on an idle box and backs it off on a struggling
    # one. A fixed quota alone could only ever do the latter.
    cpus: 10.0
    # No adaptive anything saves a box that has already run out of memory, so
    # this stays a hard stop: with 7.5 GB of RAM, a worker that would push the
    # host into swap is better killed and restarted than left to drag Postgres
    # down with it.
    mem_limit: 2g
    command: ["python", "-u", "/app/nas_library_worker.py"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kindred}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-kindred}
      PYTHONUNBUFFERED: "1"
      XDG_CACHE_HOME: /app/cache
      PHOTO_STORAGE_ROOT: /data/photos/originals
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      SCAN_SECRET: ${SCAN_SECRET:?Set SCAN_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://kindredphotos.app,https://nas.kindredphotos.app}
      FLICKR_API_KEY: ${FLICKR_API_KEY:-}
      FLICKR_SECRET: ${FLICKR_SECRET:-}
      FLICKR_OAUTH_TOKEN: ${FLICKR_OAUTH_TOKEN:-}
      FLICKR_OAUTH_SECRET: ${FLICKR_OAUTH_SECRET:-}
      FLICKR_USER_ID: ${FLICKR_USER_ID:-}
      APP_REVIEW_USERNAME: ${APP_REVIEW_USERNAME:-}
      APP_REVIEW_PASSWORD: ${APP_REVIEW_PASSWORD:-}
      PYTHONPATH: /app
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    volumes:
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/backend:/app/data
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/photos:/data/photos
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/model-cache:/app/cache
    networks: [kindred-internal]

  video-worker:
    image: kindred-api:${KINDRED_REVISION:?Set KINDRED_REVISION}
    restart: unless-stopped
    # ffmpeg happily takes every core it is given. Poster frames are the least
    # urgent thing running, so it gets the smallest share.
    cpus: 2.0
    mem_limit: 1g
    command: ["python", "-u", "/app/video_queue.py"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kindred}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-kindred}
      PYTHONUNBUFFERED: "1"
      XDG_CACHE_HOME: /app/cache
      # Evictable transforms survive application container replacements.
      IMAGE_CACHE_PATH: /app/cache/image-transforms.sqlite3
      PHOTO_STORAGE_ROOT: /data/photos/originals
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      SCAN_SECRET: ${SCAN_SECRET:?Set SCAN_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://kindredphotos.app,https://nas.kindredphotos.app}
      FLICKR_API_KEY: ${FLICKR_API_KEY:-}
      FLICKR_SECRET: ${FLICKR_SECRET:-}
      FLICKR_OAUTH_TOKEN: ${FLICKR_OAUTH_TOKEN:-}
      FLICKR_OAUTH_SECRET: ${FLICKR_OAUTH_SECRET:-}
      FLICKR_USER_ID: ${FLICKR_USER_ID:-}
      APP_REVIEW_USERNAME: ${APP_REVIEW_USERNAME:-}
      APP_REVIEW_PASSWORD: ${APP_REVIEW_PASSWORD:-}
      PYTHONPATH: /app
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    volumes:
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/backend:/app/data
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/photos:/data/photos
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/model-cache:/app/cache
    networks: [kindred-internal]

  # Optional NAS web copy; public web deployment is handled by Vercel.
  # deploy.py only builds/recreates this with --target web.
  web:
    image: kindred-web:${KINDRED_REVISION}
    build:
      context: ${KINDRED_SOURCE_ROOT}/apps/web
      labels:
        org.opencontainers.image.revision: ${KINDRED_REVISION}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      BACKEND_URL: http://api:8000
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in .env}
      FLICKR_API_KEY: ${FLICKR_API_KEY:-}
      FLICKR_SECRET: ${FLICKR_SECRET:-}
      NEXT_PUBLIC_APP_URL: ${PUBLIC_WEB_URL:-https://nas.kindredphotos.app}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-Kindred Photos <noreply@kindredphotos.app>}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks: [kindred-internal]

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [public]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks: [kindred-internal]

  # ── iCloud libraries ──────────────────────────────────────────────────
  # One service per person, sharing the settings below. Behind a profile,
  # like tunnel and ollama, because the image is third-party with nothing to
  # build -- deploy.py builds only images required by its selected target.
  #
  #   COMPOSE_PROFILES=public,icloud   (or start one by name)
  #
  # This replaces the standalone compose file under /volume1/docker/
  # kindred-icloud, so there is one definition rather than two that can
  # disagree. Its preparation guards are carried over as real flags below.
  #
  # Authentication is deliberately absent. Establishing a session needs an
  # Apple ID password and a 2FA code, so it is done once per person by hand
  # with --auth-only; these services only reuse the resulting cookie. No
  # secret belongs in a compose file, an .env, or a log.
  icloud-michael: &icloud
    image: boredazfcuk/icloudpd:1.0.1380_06-09-2026
    profiles: [icloud]
    entrypoint: /opt/icloudpd/bin/icloudpd
    # The image's healthcheck probes the launcher daemon the entrypoint above
    # replaces; left on it reports unhealthy while downloading perfectly well.
    healthcheck:
      disable: true
    # No --set-exif-datetime. It rewrites EXIF after the download, which grows
    # the file: icloudpd then compares the size on disk against the size Apple
    # reports, decides they differ, and fetches the photo again under a
    # "-<expected size>" name. On an hourly watch that duplicates the library
    # every cycle. The dates survive without it -- iCloud originals carry
    # DateTimeOriginal, and capture_date.py reads the {:%Y/%m/%d} folders as a
    # fallback for the few that do not.
    # unless-stopped, paired with --watch-with-interval below. on-failure was
    # wrong: icloudpd exits 0 when it loses its connection to Apple ("Cannot
    # connect to Apple iCloud service"), so Docker read a dropped download as a
    # completed one and left it stopped at a quarter of the library. An exit
    # code that cannot distinguish success from failure cannot drive a restart
    # policy, so do not ask it to -- keep the process resident instead.
    restart: unless-stopped
    # Network- and IO-bound. It must not take cores from the indexer, which is
    # the thing actually short of them.
    cpus: 1.0
    mem_limit: 512m
    environment:
      TZ: America/Denver
    # Nothing on the internal network: it reaches Apple and writes to disk.
    network_mode: bridge
    command: >-
      --username ${ICLOUD_USERNAME_MICHAEL:?Set ICLOUD_USERNAME_MICHAEL in .env}
      --cookie-directory /config
      --directory /data
      --folder-structure {:%Y/%m/%d}
      --live-photo-size original
      --watch-with-interval 3600
      --log-level info
    volumes:
      - ${ICLOUD_COOKIES_MICHAEL:?Set ICLOUD_COOKIES_MICHAEL in .env}:/config
      # Each library lands in its own root, never merged and never inside the
      # Takeout tree: nothing should be cleared out of anyone's iCloud until
      # cloud_migration.py can account for their files specifically.
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/photos/imports/iCloudMichael:/data

  icloud-wife:
    <<: *icloud
    command: >-
      --username ${ICLOUD_USERNAME_WIFE:?Set ICLOUD_USERNAME_WIFE in .env}
      --cookie-directory /config
      --directory /data
      --folder-structure {:%Y/%m/%d}
      --live-photo-size original
      --watch-with-interval 3600
      --log-level info
    volumes:
      - ${ICLOUD_COOKIES_WIFE:?Set ICLOUD_COOKIES_WIFE in .env}:/config
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/photos/imports/iCloudWife:/data

  icloud-madison:
    <<: *icloud
    command: >-
      --username ${ICLOUD_USERNAME_MADISON:?Set ICLOUD_USERNAME_MADISON in .env}
      --cookie-directory /config
      --directory /data
      --folder-structure {:%Y/%m/%d}
      --live-photo-size original
      --watch-with-interval 3600
      --log-level info
    volumes:
      - ${ICLOUD_COOKIES_MADISON:?Set ICLOUD_COOKIES_MADISON in .env}:/config
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/photos/imports/iCloudMadison:/data

networks:
  kindred-internal:
    driver: bridge
