# Production deployment template: rendered from a pinned Git commit.
name: kindred

services:
  database:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kindred}
      POSTGRES_USER: ${POSTGRES_USER:-kindred}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [kindred-internal]

  api:
    image: kindred-api:${KINDRED_REVISION:?Set KINDRED_REVISION}
    build:
      context: ${KINDRED_SOURCE_ROOT:?Set KINDRED_SOURCE_ROOT}/backend
      labels:
        org.opencontainers.image.revision: ${KINDRED_REVISION}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kindred}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-kindred}
      PYTHONUNBUFFERED: "1"
      XDG_CACHE_HOME: /app/cache
      PHOTO_STORAGE_ROOT: /data/photos/originals
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      SCAN_SECRET: ${SCAN_SECRET:?Set SCAN_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://kindredphotos.app,https://nas.kindredphotos.app}
      FLICKR_API_KEY: ${FLICKR_API_KEY:-}
      FLICKR_SECRET: ${FLICKR_SECRET:-}
      FLICKR_OAUTH_TOKEN: ${FLICKR_OAUTH_TOKEN:-}
      FLICKR_OAUTH_SECRET: ${FLICKR_OAUTH_SECRET:-}
      FLICKR_USER_ID: ${FLICKR_USER_ID:-}
      APP_REVIEW_USERNAME: ${APP_REVIEW_USERNAME:-}
      APP_REVIEW_PASSWORD: ${APP_REVIEW_PASSWORD:-}
    volumes:
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/backend:/app/data
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/photos:/data/photos
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/model-cache:/app/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks: [kindred-internal]

  library-worker:
    image: kindred-api:${KINDRED_REVISION:?Set KINDRED_REVISION}
    restart: on-failure
    # The worker paces itself now -- see backend/throttle.py -- so the quota is
    # a guard rail rather than the control. It leaves two of the twelve cores
    # for the host and the API no matter what the loop decides; the loop is what
    # gives the run full speed on an idle box and backs it off on a struggling
    # one. A fixed quota alone could only ever do the latter.
    cpus: 10.0
    # No adaptive anything saves a box that has already run out of memory, so
    # this stays a hard stop: with 7.5 GB of RAM, a worker that would push the
    # host into swap is better killed and restarted than left to drag Postgres
    # down with it.
    mem_limit: 2g
    command: ["python", "-u", "/app/nas_library_worker.py"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kindred}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-kindred}
      PYTHONUNBUFFERED: "1"
      XDG_CACHE_HOME: /app/cache
      PHOTO_STORAGE_ROOT: /data/photos/originals
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      SCAN_SECRET: ${SCAN_SECRET:?Set SCAN_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://kindredphotos.app,https://nas.kindredphotos.app}
      FLICKR_API_KEY: ${FLICKR_API_KEY:-}
      FLICKR_SECRET: ${FLICKR_SECRET:-}
      FLICKR_OAUTH_TOKEN: ${FLICKR_OAUTH_TOKEN:-}
      FLICKR_OAUTH_SECRET: ${FLICKR_OAUTH_SECRET:-}
      FLICKR_USER_ID: ${FLICKR_USER_ID:-}
      APP_REVIEW_USERNAME: ${APP_REVIEW_USERNAME:-}
      APP_REVIEW_PASSWORD: ${APP_REVIEW_PASSWORD:-}
      PYTHONPATH: /app
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    volumes:
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/backend:/app/data
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/photos:/data/photos
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/model-cache:/app/cache
    networks: [kindred-internal]

  video-worker:
    image: kindred-api:${KINDRED_REVISION:?Set KINDRED_REVISION}
    restart: unless-stopped
    # ffmpeg happily takes every core it is given. Poster frames are the least
    # urgent thing running, so it gets the smallest share.
    cpus: 2.0
    mem_limit: 1g
    command: ["python", "-u", "/app/video_queue.py"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kindred}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-kindred}
      PYTHONUNBUFFERED: "1"
      XDG_CACHE_HOME: /app/cache
      PHOTO_STORAGE_ROOT: /data/photos/originals
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      SCAN_SECRET: ${SCAN_SECRET:?Set SCAN_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://kindredphotos.app,https://nas.kindredphotos.app}
      FLICKR_API_KEY: ${FLICKR_API_KEY:-}
      FLICKR_SECRET: ${FLICKR_SECRET:-}
      FLICKR_OAUTH_TOKEN: ${FLICKR_OAUTH_TOKEN:-}
      FLICKR_OAUTH_SECRET: ${FLICKR_OAUTH_SECRET:-}
      FLICKR_USER_ID: ${FLICKR_USER_ID:-}
      APP_REVIEW_USERNAME: ${APP_REVIEW_USERNAME:-}
      APP_REVIEW_PASSWORD: ${APP_REVIEW_PASSWORD:-}
      PYTHONPATH: /app
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    volumes:
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/backend:/app/data
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/photos:/data/photos
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/model-cache:/app/cache
    networks: [kindred-internal]

  web:
    image: kindred-web:${KINDRED_REVISION}
    build:
      context: ${KINDRED_SOURCE_ROOT}/apps/web
      labels:
        org.opencontainers.image.revision: ${KINDRED_REVISION}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      BACKEND_URL: http://api:8000
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in .env}
      FLICKR_API_KEY: ${FLICKR_API_KEY:-}
      FLICKR_SECRET: ${FLICKR_SECRET:-}
      NEXT_PUBLIC_APP_URL: ${PUBLIC_WEB_URL:-https://nas.kindredphotos.app}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-Kindred Photos <noreply@kindredphotos.app>}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks: [kindred-internal]

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [public]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks: [kindred-internal]

  # Pulls an iCloud Photo Library down onto the NAS. Behind a profile, like
  # tunnel and ollama, because it uses a third-party image with nothing to
  # build -- deploy.py builds everything in its SERVICES list, so a service
  # with no build context does not belong there.
  #
  # Start it with:  COMPOSE_PROFILES=public,icloud
  #
  # Authentication is deliberately not here. icloudpd is run once by hand with
  # --auth-only to establish the session, because that step needs an Apple ID
  # password and a 2FA code, and neither belongs in a compose file, an .env, or
  # a log. This service only reuses the cookie that produced.
  icloud-michael:
    image: boredazfcuk/icloudpd:1.0.1380_06-09-2026
    profiles: [icloud]
    entrypoint: /opt/icloudpd/bin/icloudpd
    # The image ships a healthcheck for its own launcher daemon, which the
    # entrypoint above replaces. Left on, it reports unhealthy while the
    # download runs perfectly well -- and a container that always cries wolf
    # hides the failure worth seeing.
    healthcheck:
      disable: true
    # on-failure, not unless-stopped: a completed library should stop, not spin
    # back through every asset forever.
    restart: on-failure:5
    # Downloading is network- and IO-bound. It must not take cores from the
    # indexer, which is the thing actually short of them.
    cpus: 1.0
    mem_limit: 512m
    command: >-
      --username ${ICLOUD_USERNAME:?Set ICLOUD_USERNAME in .env}
      --cookie-directory /config
      --directory /data
      --folder-structure {:%Y/%m/%d}
      --set-exif-datetime
      --live-photo-size original
      --log-level info
    # Nothing on the internal network: it reaches Apple and writes to disk, and
    # naming no network here made compose create a stray default one.
    network_mode: bridge
    volumes:
      - ${ICLOUD_COOKIE_DIR:?Set ICLOUD_COOKIE_DIR in .env}:/config
      # A sibling of the Takeout tree, never inside it: this library has to stay
      # separately auditable before anything is cleared out of iCloud.
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/photos/imports/iCloudMichael:/data

networks:
  kindred-internal:
    driver: bridge
