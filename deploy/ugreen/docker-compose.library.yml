# Opt-in overlay for the release template. Does not enable the legacy copy importer.
x-library-worker: &library-worker
  image: kindred-api:${KINDRED_REVISION:?Set KINDRED_REVISION}
  restart: unless-stopped
  depends_on:
    api:
      condition: service_healthy
  environment: &library-environment
    DATABASE_URL: ${RAILWAY_DATABASE_URL:-postgresql://${POSTGRES_USER:-kindred}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-kindred}}
    PHOTO_STORAGE_ROOT: /data/photos/originals
    PHOTO_LIBRARY_ROOT: /data/library
    KINDRED_BROWSE_ROOT: /data/library
    XDG_CACHE_HOME: /app/cache
    OMP_NUM_THREADS: "2"
    MKL_NUM_THREADS: "2"
    OPENBLAS_NUM_THREADS: "2"
    # Defaults remain conservative; tune to measured disk behavior per installation.
    KINDRED_IO_HIGH: ${KINDRED_IO_HIGH:-40}
    KINDRED_IO_LOW: ${KINDRED_IO_LOW:-15}
    KINDRED_NAS_INDEXING_PRIORITY: "1"
  volumes:
    - ${NAS_LIBRARY_SOURCE:?Set NAS_LIBRARY_SOURCE}:/data/library:ro
    - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/backend:/app/data
    - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/photos:/data/photos
    - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/model-cache:/app/cache
  networks: [kindred-internal]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  api:
    environment:
      PHOTO_LIBRARY_ROOT: /data/library
      KINDRED_BROWSE_ROOT: /data/library
      KINDRED_BROWSE_DISPLAY_ROOT: ${NAS_LIBRARY_SOURCE:?Set NAS_LIBRARY_SOURCE}
      KINDRED_STORAGE_NAME: ${KINDRED_STORAGE_NAME:-Home NAS}
      KINDRED_HOUSEHOLD_NAME: ${KINDRED_HOUSEHOLD_NAME:-}
    volumes:
      - ${NAS_LIBRARY_SOURCE:?Set NAS_LIBRARY_SOURCE}:/data/library:ro

  nas-discovery:
    <<: *library-worker
    restart: on-failure
    cpus: 2
    mem_limit: 2g
    command: [python, -u, /app/discover_nas_library.py, /data/library]

  nas-previews:
    <<: *library-worker
    cpus: 4
    mem_limit: 4g
    command: [python, -u, /app/prepare_nas_previews.py]

  nas-recognition:
    <<: *library-worker
    cpus: ${KINDRED_RECOGNITION_CPUS:-4}
    cpu_shares: 256
    mem_limit: 8g
    environment:
      <<: *library-environment
      KINDRED_RECOGNITION_WORKERS: ${KINDRED_RECOGNITION_WORKERS:-2}
    command: [python, -u, /app/index_nas_watch.py]

  flickr-original-match:
    <<: *library-worker
    profiles: [flickr-match]
    cpus: 1
    mem_limit: 768m
    environment:
      <<: *library-environment
      FLICKR_API_KEY: ${FLICKR_API_KEY:-}
      FLICKR_SECRET: ${FLICKR_SECRET:-}
      KINDRED_HOUSEHOLD_FLICKR_USER_ID: ${KINDRED_HOUSEHOLD_FLICKR_USER_ID:-}
    command: [python, -u, /app/flickr_match_worker.py, --watch, --albums-first]
    volumes:
      - ${NAS_LIBRARY_SOURCE:?Set NAS_LIBRARY_SOURCE}:/data/library:ro
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/backend:/app/data
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/photos:/data/photos:ro
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/flickr-match:/app/flickr-match

  flickr-nas-backup:
    <<: *library-worker
    profiles: [flickr-match]
    cpus: 1
    mem_limit: 768m
    environment:
      <<: *library-environment
      FLICKR_API_KEY: ${FLICKR_API_KEY:-}
      FLICKR_SECRET: ${FLICKR_SECRET:-}
      KINDRED_HOUSEHOLD_FLICKR_USER_ID: ${KINDRED_HOUSEHOLD_FLICKR_USER_ID:-}
    command: [python, -u, /app/flickr_nas_backup.py, --watch, --apply]
    volumes:
      - ${NAS_LIBRARY_SOURCE:?Set NAS_LIBRARY_SOURCE}:/data/library:ro
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/backend:/app/data
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/photos:/data/photos:ro
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/flickr-backup:/app/flickr-backup

  r2-thumbnail-publisher:
    image: kindred-api:${KINDRED_REVISION:?Set KINDRED_REVISION}
    profiles: [r2]
    restart: "on-failure:5"
    cpus: 1
    mem_limit: 512m
    env_file:
      - path: .env.r2
        required: false
    command:
      - python
      - -u
      - /app/publish_r2_thumbnails.py
      - --wait-for-previews
      - /app/data
      - --checkpoint
      - /app/publisher/thumbnails.sqlite
      - --watch
      - --status
      - /app/status/r2-thumbnail-status.json
    volumes:
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/backend:/app/data:ro
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/backend/worker-status:/app/status
      - ${KINDRED_DATA_ROOT:?Set KINDRED_DATA_ROOT}/r2-publisher:/app/publisher
    networks: [kindred-internal]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
