<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1320, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=Instrument+Sans:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --paper: #FBF4E7;
    --ash: #2A201B;
    --ember: #C9551C;
    --gold: #E9B85D;
    --pine: #6D3C24;
    --forest: #2F4A36;
    --canvas: #F7EBD4;
  }

  body {
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    padding: 40px;
  }

  .screen {
    width: 1320px;
    height: 2868px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  /* ── Background layers ─────────────────────────────── */
  .screen .bg-photo {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    filter: blur(50px) saturate(1.2);
    transform: scale(1.15);
  }

  .screen .bg-overlay {
    position: absolute;
    inset: 0;
  }

  .screen .bg-vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 30%, transparent 30%, rgba(0,0,0,0.35) 100%);
  }

  .screen .bg-noise {
    position: absolute;
    inset: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px;
  }

  /* ── Text area ─────────────────────────────────────── */
  .screen .text-area {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 38%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 0 86px 40px;
    z-index: 3;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 10px 22px;
    border-radius: 100px;
    font: 600 22px/1 'IBM Plex Mono', monospace;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 28px;
    width: fit-content;
  }

  .hl-muted {
    font: 700 152px/0.92 'Space Grotesk', sans-serif;
    letter-spacing: -3px;
    opacity: 0.5;
  }

  .hl-bold {
    font: 700 152px/0.92 'Space Grotesk', sans-serif;
    letter-spacing: -3px;
    margin-top: -4px;
  }

  .accent-line {
    width: 120px;
    height: 4px;
    border-radius: 2px;
    margin-top: 32px;
  }

  /* ── Device frame ──────────────────────────────────── */
  .device-wrap {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) perspective(1800px) rotateY(-4deg) rotateX(2deg);
    z-index: 10;
    filter: drop-shadow(0 40px 80px rgba(0,0,0,0.4)) drop-shadow(0 15px 30px rgba(0,0,0,0.3));
  }

  .device-wrap img {
    display: block;
    height: 1720px;
    width: auto;
    border-radius: 4px;
  }

  /* Alternate tilt direction for variety */
  #s02 .device-wrap,
  #s04 .device-wrap,
  #s07 .device-wrap,
  #s08 .device-wrap {
    transform: translateX(-50%) perspective(1800px) rotateY(4deg) rotateX(2deg);
  }

  /* Slight upward shift on dark backgrounds for more drama */
  #s01 .device-wrap,
  #s03 .device-wrap,
  #s06 .device-wrap {
    bottom: 80px;
  }

  /* ── Decorative floating photos ────────────────────── */
  .float-photo {
    position: absolute;
    z-index: 3;
    border-radius: 12px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    object-fit: cover;
    opacity: 0.15;
  }

  /* ── Screen-specific themes ────────────────────────── */

  /* 01 - Home Feed: warm campfire */
  #s01 .bg-photo { background-image: url('/demo/photos/family-campfire-1.jpg'); }
  #s01 .bg-overlay { background: linear-gradient(170deg, rgba(35,25,18,0.82) 0%, rgba(60,40,25,0.88) 50%, rgba(25,18,12,0.95) 100%); }
  #s01 .hl-muted, #s01 .hl-bold { color: var(--paper); }
  #s01 .badge { background: var(--gold); color: var(--ash); }
  #s01 .accent-line { background: var(--gold); }

  /* 02 - People: warm light */

  #s02 .bg-overlay { background: linear-gradient(170deg, rgba(251,244,231,0.88) 0%, rgba(240,225,200,0.92) 100%); }
  #s02 .hl-muted, #s02 .hl-bold { color: var(--ash); }
  #s02 .badge { background: var(--ember); color: white; }
  #s02 .accent-line { background: var(--ember); }

  /* 03 - Person Detail: deep dark */

  #s03 .bg-overlay { background: linear-gradient(170deg, rgba(18,12,8,0.85) 0%, rgba(50,30,20,0.90) 100%); }
  #s03 .hl-muted, #s03 .hl-bold { color: var(--paper); }
  #s03 .accent-line { background: var(--gold); }

  /* 04 - Pets: forest green */

  #s04 .bg-overlay { background: linear-gradient(170deg, rgba(30,55,35,0.85) 0%, rgba(20,40,25,0.92) 100%); }
  #s04 .hl-muted, #s04 .hl-bold { color: var(--paper); }
  #s04 .badge { background: var(--gold); color: var(--ash); }
  #s04 .accent-line { background: var(--gold); }

  /* 05 - Vehicles: warm charcoal */
  #s05 .bg-photo { background-image: url('/demo/photos/family-roadtrip.jpg'); }
  #s05 .bg-overlay { background: linear-gradient(170deg, rgba(35,28,22,0.85) 0%, rgba(55,40,30,0.92) 100%); }
  #s05 .hl-muted, #s05 .hl-bold { color: var(--paper); }
  #s05 .accent-line { background: var(--ember); }

  /* 06 - Search: bold ember */

  /* 07 - Together: warm canvas */

  /* 09 - Login: forest */

  /* 10 - Onboarding: deep forest */

  #s10 .hl-muted, #s10 .hl-bold { color: var(--paper); }
  #s10 .accent-line { background: var(--gold); }
</style>
