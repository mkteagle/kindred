[package]
name = "kindred-uploader"
version = "0.1.0"
description = "Kindred desktop bulk uploader to Flickr"
authors = ["Michael Teagle"]
edition = "2021"

[lib]
name = "kindred_uploader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["multipart", "rustls-tls", "json", "stream"] }
futures-util = "0.3"

rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
sha2 = "0.10"

anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
