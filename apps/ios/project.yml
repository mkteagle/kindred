name: Kindred
options:
  bundleIdPrefix: com.kindlingsignal
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: true
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    INFOPLIST_FILE: Kindred/Info.plist
targets:
  Kindred:
    type: application
    platform: iOS
    sources:
      - Kindred
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kindlingsignal.kindred
        PRODUCT_NAME: Kindred
        INFOPLIST_FILE: Kindred/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarStyle: ""
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    info:
      path: Kindred/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - kindred
            CFBundleURLName: com.kindlingsignal.kindred
        NSPhotoLibraryUsageDescription: Kindred needs access to your photo library to upload and manage photos.
        NSPhotoLibraryAddUsageDescription: Kindred needs access to save photos to your library.
