name: Kindred
options:
  bundleIdPrefix: com.kindlingsignal
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: L2T2KBN2GC
    GENERATE_INFOPLIST_FILE: true
    MARKETING_VERSION: "1.0.0"
    # App Store Connect already contains builds through 154.
    CURRENT_PROJECT_VERSION: 155
    INFOPLIST_FILE: Kindred/Info.plist
targets:
  Kindred:
    type: application
    platform: iOS
    sources:
      - Kindred
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kindlingsignal.kindred
        PRODUCT_NAME: "Kindred Photos"
        INFOPLIST_KEY_CFBundleDisplayName: "Kindred Photos"
        INFOPLIST_FILE: Kindred/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarStyle: ""
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    info:
      path: Kindred/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - kindred
            CFBundleURLName: com.kindlingsignal.kindred
        NSPhotoLibraryUsageDescription: Kindred needs access to your photo library to upload and manage photos.
        NSPhotoLibraryAddUsageDescription: Kindred needs access to save photos to your library.
        UIBackgroundModes:
          - fetch
          - processing
          - remote-notification
        UIAppFonts:
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-SemiBold.ttf
          - SpaceGrotesk-Bold.ttf
          - InstrumentSans-Regular.ttf
          - InstrumentSans-Medium.ttf
          - InstrumentSans-SemiBold.ttf
          - InstrumentSans-Bold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
        BGTaskSchedulerPermittedIdentifiers:
          - com.kindlingsignal.kindred.sync

  KindredScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - KindredScreenshots
    dependencies:
      - target: Kindred
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kindlingsignal.kindred.screenshots
        TEST_TARGET_NAME: Kindred
        GENERATE_INFOPLIST_FILE: true

schemes:
  Kindred:
    build:
      targets:
        Kindred: all
        KindredScreenshots: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KindredScreenshots
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  KindredScreenshots:
    build:
      targets:
        Kindred: all
        KindredScreenshots: [test]
    test:
      config: Debug
      targets:
        - KindredScreenshots
