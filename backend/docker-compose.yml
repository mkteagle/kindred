services:
  backend:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./main.py:/app/main.py
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
