# StoreShip release configuration for Kindred Photos.
# Store credentials live in .env.local and ~/.appstoreconnect; never commit them.
# KINDRED_REVIEW_PASSWORD is the private password for the seeded review server.
#
# Validate without publishing:
#   storeship ship --config storeship.yml --platform ios --dry-run
#
# Refresh screenshots and publish the listing (no binary):
#   storeship ship --config storeship.yml --platform ios --shoot
#
# Build and upload only after the release checklist passes:
#   storeship ship --config storeship.yml --platform ios --build --tag 1.0.0

name: Kindred Photos
repo: .
locales: [en-US]

ios:
  bundle_id: com.kindlingsignal.kindred
  app_id: "6763926175"
  scheme: Kindred
  configuration: Release
  project_path: apps/ios/Kindred.xcodeproj
  screenshot_test: KindredScreenshots/KindredScreenshots
  # Kindred owns a richer, device-aware screenshot renderer. StoreShip invokes
  # it for `ship --shoot`, then publishes the generated StoreShip-configured dirs.
  screenshot_command: ["./tools/screenshot-pipeline.sh"]
  devices: ["iPhone 17 Pro Max", "iPad Pro 13-inch (M5)"]
  metadata_dir: apps/ios/storeship/metadata/en-US
  screenshots:
    - screenshots/appstore/iphone69
    - screenshots/appstore/ipad
  asc:
    key_id: "${ASC_KEY_ID}"
    issuer_id: "${ASC_ISSUER_ID}"
    key_path: ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
  copyright: "2026 Kindling Signal"
  privacy_policy_url: https://kindredphotos.app/privacy
  beta:
    contact_first_name: Michael
    contact_last_name: Teagle
    contact_email: mkteagle@gmail.com
    contact_phone: "${APP_REVIEW_PHONE}"
    demo_account_name: kindred-reviewer
    demo_account_password: "${KINDRED_REVIEW_PASSWORD}"
    demo_account_required: true
    privacy_policy_url: https://kindredphotos.app/privacy
    marketing_url: https://kindredphotos.app
    description: >-
      Connect to the Kindred review server to browse a fictional household
      library, search by capture date, and try a temporary on-device photo import.
    notes: >-
      Open Kindred, choose Enter server address, and enter
      https://demo.kindredphotos.app. Tap Continue and use the private reviewer
      credentials below. The library contains fictional photos. Server uploads
      and permanent changes are disabled. The Library plus button opens a
      local-only preview for up to five photos. Temporary copies expire after an hour.
  app_store_review:
    contact_first_name: Michael
    contact_last_name: Teagle
    contact_email: mkteagle@gmail.com
    contact_phone: "${APP_REVIEW_PHONE}"
    demo_account_name: kindred-reviewer
    demo_account_password: "${KINDRED_REVIEW_PASSWORD}"
    demo_account_required: true
    notes: |-
      Purpose and audience
      Kindred Photos is a free photo library and backup client for families who run their own Kindred server. Members can back up photos and videos, browse a shared library, keep personal favorites, and find older media by date or other metadata. There are no paid features or in-app purchases.

      How to review the app
      From a fresh launch, finish onboarding and tap Get started. Choose Enter server address, enter https://demo.kindredphotos.app, tap Continue, then sign in with the credentials in the App Review Instructions fields. The server has 12 fictional photos in two albums. Open Library, view a photo, try Search with November 2025, and browse Favorites on Home. In the photo viewer, choose More actions, then Archive sample. Archived photos restore after one hour. The Library plus button lets you select up to five local photos for a temporary preview. These copies expire after one hour. The review server is read-only for uploads and permanent changes.

      Household accounts and content
      On a regular installation, a household administrator creates an invite code. Members choose Join Kindred on the sign-in screen and enter the invite, a display name, a username, and a password. They can delete their account from Settings, Account, Manage account, Delete Account. Household owners can transfer ownership or delete the household. Shared media stays within the household, and administrators can remove members and revoke their access. The seeded reviewer account is for browsing the sample library.

      Services and regional availability
      Core functionality uses the household's own Kindred HTTPS server, PostgreSQL catalog, and storage such as a NAS. iOS PhotoKit is used after the user grants photo access. Flickr is optional for secondary backup. Google and Sign in with Apple are optional on installations configured for those sign-in methods. Face grouping and photo indexing run on the household's server. App features and sample content are the same across storefronts. The review media depict fictional examples, and ordinary households supply their own library content.
  what_to_test: >-
    Enter https://demo.kindredphotos.app and sign in with the review credentials.
    Browse the seeded library, search for November 2025, and archive a sample
    from the photo viewer. Try a local-only import from the Library plus button.
    On a disposable self-hosted household, test account deletion, ownership
    transfer, and whole-household deletion under Settings, Account, Manage account.

